<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>VRM Viewer - GitHub CDN</title>
    <style>
        body { margin: 0; background: #1a1a2e; color: white; font-family: Arial; }
        #c { width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; max-height: 90vh; overflow-y: auto; }
        #st { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 5px; }
        #log { font-family: monospace; font-size: 11px; color: #aaa; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="c"></div>
    <div id="ui">
        <h2>VRM Viewer</h2>
        <input type="file" id="f" accept=".vrm"><br><br>
        <label>Scale: <input type="range" id="sc" min="0.1" max="5" value="1"></label><br><br>
        <label><input type="checkbox" id="rt" checked> Rotate</label>
        <div id="log"></div>
    </div>
    <div id="st">Loading...</div>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Try unpkg for VRM -->
    <script src="https://unpkg.com/@pixiv/three-vrm@0.6.10/build/three-vrm.min.js"></script>
    
    <script>
        const st = document.getElementById('st');
        const log = (m) => { document.getElementById('log').innerHTML += '<br>' + m; };
        
        setTimeout(() => {
            if (typeof THREE === 'undefined') {
                st.textContent = 'Three.js failed';
                st.style.color = 'red';
            } else if (typeof THREE.VRM === 'undefined') {
                st.textContent = 'VRM failed - trying script tag...';
                st.style.color = 'orange';
                
                // Last resort: load via script injection
                const s = document.createElement('script');
                s.src = 'https://unpkg.com/@pixiv/three-vrm@0.6.10/build/three-vrm.min.js';
                s.onload = () => {
                    if (typeof THREE.VRM !== 'undefined') {
                        st.textContent = 'VRM loaded via script tag!';
                        st.style.color = '#0f0';
                        init();
                    } else {
                        st.textContent = 'All VRM loading failed. Check firewall.';
                        st.style.color = 'red';
                    }
                };
                s.onerror = () => {
                    st.textContent = 'Script load failed';
                    st.style.color = 'red';
                };
                document.head.appendChild(s);
            } else {
                st.textContent = 'Ready - Load a VRM';
                st.style.color = '#0f0';
                init();
            }
        }, 3000);
        
        function init() {
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('c').appendChild(renderer.domElement);
            
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 20);
            camera.position.set(0, 1.4, 3);
            
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1.4, 0);
            
            const dl = new THREE.DirectionalLight(0xffffff, 1);
            dl.position.set(1, 1, 1);
            scene.add(dl);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            
            const loader = new THREE.GLTFLoader();
            let vrm = null;
            
            document.getElementById('f').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                log('Loading: ' + file.name);
                const url = URL.createObjectURL(file);
                
                loader.load(url, (gltf) => {
                    log('GLTF OK');
                    THREE.VRM.from(gltf).then((vrmModel) => {
                        log('VRM OK');
                        if (vrm) scene.remove(vrm.scene);
                        vrm = vrmModel;
                        scene.add(vrm.scene);
                        st.textContent = 'Loaded!';
                        URL.revokeObjectURL(url);
                    }).catch(err => {
                        log('VRM Error: ' + err.message);
                        st.textContent = 'VRM Error';
                        st.style.color = 'red';
                    });
                }, undefined, (err) => {
                    log('Load Error: ' + err.message);
                });
            });
            
            document.getElementById('sc').addEventListener('input', (e) => {
                if (vrm) vrm.scene.scale.setScalar(+e.target.value);
            });
            
            let ws;
            function cw() {
                ws = new WebSocket('ws://localhost:8765');
                ws.onopen = () => log('WS OK');
                ws.onclose = () => setTimeout(cw, 3000);
                ws.onmessage = (ev) => {
                    if (!vrm) return;
                    const d = JSON.parse(ev.data);
                    if (d.expressions) for (const [k,v] of Object.entries(d.expressions)) vrm.expressionManager?.setValue(k, v);
                    if (d.lookAt) vrm.lookAt?.applyer?.setValue(d.lookAt.yaw||0, d.lookAt.pitch||0);
                };
            }
            cw();
            
            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                if (vrm) {
                    vrm.update(clock.getDelta());
                    if (document.getElementById('rt').checked) vrm.scene.rotation.y += 0.005;
                }
                renderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>
