<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>VRM Viewer</title>
    <style>
        body { margin: 0; background: #1a1a2e; color: white; font-family: Arial; }
        #c { width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.9); padding: 20px; border-radius: 10px; }
        #st { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.9); padding: 15px; border-radius: 5px; color: #0f0; }
        #log { font-family: monospace; font-size: 11px; color: #0f0; margin-top: 15px; background: #000; padding: 10px; max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <div id="c"></div>
    <div id="ui">
        <h2>VRM Viewer</h2>
        <input type="file" id="f" accept=".vrm"><br><br>
        <label>Scale: <input type="range" id="sc" min="0.1" max="5" value="1"></label><br><br>
        <label><input type="checkbox" id="rt" checked> Rotate</label>
        <div id="log"></div>
    </div>
    <div id="st">Ready</div>
    
    <script src="vrm_libs/three.min.js"></script>
    <script src="vrm_libs/GLTFLoader.js"></script>
    <script src="vrm_libs/OrbitControls.js"></script>
    <script src="vrm_libs/three-vrm.min.js"></script>
    
    <script>
        const st = document.getElementById('st');
        const logDiv = document.getElementById('log');
        const log = (m) => { logDiv.innerHTML += '<br>' + m; logDiv.scrollTop = logDiv.scrollHeight; console.log(m); };
        
        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('c').appendChild(renderer.domElement);
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 20);
        camera.position.set(0, 1.4, 3);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.4, 0);
        
        scene.add(new THREE.DirectionalLight(0xffffff, 1));
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        
        const loader = new THREE.GLTFLoader();
        let vrm = null;
        
        document.getElementById('f').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            log('Loading: ' + file.name);
            const url = URL.createObjectURL(file);
            
            loader.load(url, (gltf) => {
                THREE.VRM.from(gltf).then((vrmModel) => {
                    if (vrm) scene.remove(vrm.scene);
                    vrm = vrmModel;
                    scene.add(vrm.scene);
                    
                    log('=== VRM LOADED ===');
                    log('expressionManager: ' + !!vrm.expressionManager);
                    
                    if (vrm.expressionManager && vrm.expressionManager.expressions) {
                        const names = Object.keys(vrm.expressionManager.expressions);
                        log('Available expressions (' + names.length + '):');
                        log(names.slice(0, 20).join(', '));
                        if (names.length > 20) log('... and ' + (names.length - 20) + ' more');
                    }
                    
                    st.textContent = 'Loaded!';
                    URL.revokeObjectURL(url);
                });
            });
        });
        
        let ws;
        function cw() {
            ws = new WebSocket('ws://localhost:8765');
            ws.onopen = () => log('WS Connected');
            ws.onclose = () => setTimeout(cw, 3000);
            ws.onmessage = (ev) => {
                log('WS Message: ' + ev.data);
                if (!vrm || !vrm.expressionManager) {
                    log('No VRM or expressionManager');
                    return;
                }
                
                const d = JSON.parse(ev.data);
                if (d.expressions) {
                    log('Received expressions: ' + JSON.stringify(d.expressions));
                    for (const [name, value] of Object.entries(d.expressions)) {
                        if (vrm.expressionManager.expressions[name]) {
                            vrm.expressionManager.setValue(name, value);
                            log('  SET ' + name + ' = ' + value);
                        } else {
                            log('  MISSING: ' + name);
                        }
                    }
                }
            };
        }
        cw();
        
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            if (vrm) {
                vrm.update(clock.getDelta());
                if (document.getElementById('rt').checked) vrm.scene.rotation.y += 0.005;
            }
            renderer.render(scene, camera);
        }
        animate();
        log('Ready - load VRM then run test_livelink_sender.py');
    </script>
</body>
</html>
